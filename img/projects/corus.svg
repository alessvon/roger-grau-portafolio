<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-labelledby="title">
  <title id="title">Vista previa Corus — LMS multi-tenant de itinerarios</title>
  <rect width="400" height="220" fill="#1d4ed8"/>
  <rect x="22" y="22" width="356" height="28" rx="6" fill="#111111" opacity="0.45"/>
  <!-- anillo de progreso -->
  <circle cx="92" cy="130" r="42" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.25"/>
  <circle cx="92" cy="130" r="42" fill="none" stroke="#E8FF00" stroke-width="12" stroke-linecap="round" stroke-dasharray="185 264" transform="rotate(-90 92 130)"/>
  <!-- itinerario: módulos / hitos como barras segmentadas -->
  <rect x="166" y="78" width="200" height="16" rx="8" fill="#ffffff" opacity="0.85"/>
  <rect x="166" y="108" width="150" height="16" rx="8" fill="#ffffff" opacity="0.6"/>
  <rect x="166" y="138" width="180" height="16" rx="8" fill="#ffffff" opacity="0.6"/>
  <rect x="166" y="168" width="110" height="16" rx="8" fill="#ffffff" opacity="0.4"/>
  <text x="22" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Corus</text>
</svg>
